# ==============================================================================
# BidGuard-Agent · Nginx 生产入口层配置（四容器编排）
# 挂载路径：deploy/nginx/nginx.conf -> /etc/nginx/conf.d/default.conf:ro
# 静态托管：frontend/dist -> /usr/share/nginx/html:ro（支持 Vue Router History 回退）
# 反向代理：/api/ -> http://app:8000（含 SSE 进度流零缓冲与 3600s 长连接超时）
# ==============================================================================

server {
    listen 80;
    server_name _;

    # 对齐后端上传文件体积上限（招投标双书 PDF/DOCX 最大允许 100MB）
    client_max_body_size 100m;

    # 1. 专项通道：防废标体检 SSE 实时进度流（严禁缓冲，长超时 3600s）
    location ~ ^/api/checks/[0-9]+/stream$ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # 2. 后端 FastAPI 全部业务路由反向代理（同样关闭缓冲以兼容大文件流与长耗时 ReAct 问答）
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 3. OpenAPI 交互文档转发
    location ~ ^/(docs|openapi\.json|redoc) {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. 前端 Vue 3 SPA 静态资源直发与 History 模式深链回退（刷新 /checks 等路径不报 404）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}