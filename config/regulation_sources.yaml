# BidGuard 法规库 · 官网更新源配置（E4）
# 用途：POST /api/regulations/crawl 逐源拉取官方公布页，解析条文后与库内 content_hash 比对更新。
# URL 均为官方来源（中国政府网 / 中国人大网 / 省部级政府官网静态页），2026-11-06 由架构侧检索核实。
# adapter=static_html：requests+lxml 直接解析；JS 渲染站点拉不到正文时端点诚实报错并引导手动导入。

