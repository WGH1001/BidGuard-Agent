# 模型网关配置 —— 换部署形态只改这个文件，业务代码零改动
default_env: prod

envs:
  # 演示环境：智谱开放平台（OpenAI 兼容协议）
  demo:
    provider: cloud
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: ZHIPU_API_KEY
    timeout: 60
    models:
      flagship: glm-5.3-flash        # 统一使用极速 flash 模型，大幅提速语义审查与 ReAct 问答
      flash: glm-5.3-flash           # 全局定义提取、分类、轻量质检
      embedding: embedding-3         # E12：向量模型（激活 L2 混合检索 Rerank）；
      #   智谱官方支持 /v1/embeddings；切到无向量模型的公司
      #   统一网关时删除本行即可全自动无感知降级回 Level 1
      supports_vision: false         # E24：是否开启原生 VLM 传图（切换至 glm-4v / qwen-vl 等多模态模型时可置 true）
    chat_options:                    # 附加请求参数（经网关透传，max_tokens 除外）
      reasoning_effort: low          # v2.0.4：glm-5.3-flash 强制思考且量不可控
                                     #   （thinking.budget/effort 均被上游忽略，
                                     #    思考可烧穿 max_tokens 致 content 为空），
                                     #    实测 reasoning_effort=low 直出完整答案
    pricing:                         # 计价单位：人民币元（智谱官网价：输入 0.8 / 输出 2.8 元每百万）
      currency: CNY                     # 仅口径标注，引擎按模型名取价忽略此键
      glm-5.3-flash:  {prompt: 0.0008, completion: 0.0028}

  # 生产环境：公司内网 AI 代理网关（OpenAI 兼容协议，GLM 全系 + DeepSeek/Kimi）
  prod:
    provider: private
    base_url: http://10.0.2.81:3000/v1
    api_key_env: PRIVATE_API_KEY
    timeout: 60
    models:
      flagship: GLM-5.3-Flash
      flash: GLM-5.3-Flash
      # embedding: <可选：待公司内网网关上架向量模型后填入模型名，即可自动激活 L2 混合检索精排>
      supports_vision: false         # E24：是否开启原生 VLM 传图（切换至 glm-4v / qwen-vl 等多模态模型时可置 true）
    chat_options:
      reasoning_effort: low
      # E22：内网网关用 scripts/probe_reasoning_efforts.py --env prod 摸底后，可按实测支持的枚举值开启映射：
      # reasoning_effort_map: {low: low, medium: high, high: max}
    pricing:                           # 计价单位：网关积分 D（非人民币）——输入 0.8 D / 输出 2.8 D 每百万
      currency: D                       # 仅口径标注，引擎按模型名取价忽略此键
      GLM-5.3-Flash:  {prompt: 0.0008, completion: 0.0028}
