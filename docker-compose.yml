# ==============================================================================
# BidGuard-Agent · 四容器生产化编排（nginx + app + postgres16 + redis7）
# 启动流程：
#   1. 前端生产构建：cd frontend && npm run build && cd ..
#   2. 准备环境变量：cp deploy/.env.docker.example .env
#   3. 一键启动编排：docker compose up -d --build
#   4. 健康检查验证：curl http://127.0.0.1:8000/api/health
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bidguard-app
    environment:
      - MODEL_ENV=${MODEL_ENV:-demo}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - PRIVATE_API_KEY=${PRIVATE_API_KEY:-}
      - AUTH_SECRET=${AUTH_SECRET:-ChangeMe_BidGuard_Auth_Secret_2026_Str0ng!}
      - SSO_SECRET=${SSO_SECRET:-ChangeMe_BidGuard_SSO_Secret_2026_Str0ng!}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-BidGuard2026!}
      - DEFAULT_TENANT_NAME=${DEFAULT_TENANT_NAME:-默认机构}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-bidguard}:${POSTGRES_PASSWORD:-ChangeMe_2026_Str0ng!}@postgres:5432/${POSTGRES_DB:-bidguard}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-1}
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-0}
      - BIDGUARD_FORCE_ZERO_TOKEN=${BIDGUARD_FORCE_ZERO_TOKEN:-}
      - BIDGUARD_F4_CONCURRENCY=${BIDGUARD_F4_CONCURRENCY:-4}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-1}
      - SHOW_DEMO_LOGIN=${SHOW_DEMO_LOGIN:-1}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - app-data:/app/data
      - app-output:/app/output
      - ./config:/app/config:ro
      - ./data/corpus/regulations:/app/data/corpus/regulations:ro
      - ./data/rules/indicator_library:/app/data/rules/indicator_library
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: bidguard-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bidguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe_2026_Str0ng!}
      POSTGRES_DB: ${POSTGRES_DB:-bidguard}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bidguard} -d ${POSTGRES_DB:-bidguard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bidguard-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: bidguard-nginx
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
  app-data:
  app-output:
